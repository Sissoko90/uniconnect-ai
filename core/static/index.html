<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniConnect AI</title>
<link rel="icon" href="/logo.png" type="image/png">
<style>
  /* The palette is taken from the logo: cream, ink, terracotta. Same three
     colours on the page, in the README and on the bot's avatar, so the thing
     looks like one product rather than three. */
  :root {
    color-scheme: light dark;
    --bg: #f7f4ee; --fg: #14181d; --muted: #6b6b6b;
    --line: #e2ddd3; --card: #fffdf9; --accent: #c0551d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d; --fg: #ece9e3; --muted: #9a9a9a;
      --line: #2a2f36; --card: #1b2026; --accent: #e07a42;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 16px 64px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  main { max-width: 680px; margin-inline: auto; padding-block: 48px 0; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  header img {
    width: 48px; height: 48px; border-radius: 12px; flex: none;
    /* The logo carries its own cream ground, so it needs a rounded frame to
       sit on a dark page without looking like a pasted square. */
  }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  .tagline { color: var(--muted); margin: 0 0 32px; font-size: .95rem; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input, button {
    font: inherit; border-radius: 10px; border: 1px solid var(--line);
  }
  input {
    flex: 1; padding: 12px 14px; background: var(--card); color: var(--fg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 12px 18px; background: var(--accent); color: #fff;
    border-color: transparent; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: .55; cursor: default; }
  .hint { color: var(--muted); font-size: .85rem; margin: 0 0 28px; }
  .hint button {
    background: none; color: var(--accent); border: none; padding: 0 2px;
    font-weight: 400; font-size: inherit; text-decoration: underline;
    cursor: pointer;
  }
  .answer {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 20px; white-space: pre-wrap;
  }
  .flag {
    display: inline-block; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 9px; margin-bottom: 10px;
  }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .source {
    border-left: 2px solid var(--line); padding: 2px 0 2px 14px;
    margin-bottom: 14px;
  }
  .who { font-size: .85rem; color: var(--muted); margin-bottom: 3px; }
  .who b { color: var(--fg); font-weight: 600; }
  .quote { font-size: .92rem; white-space: pre-wrap; }
  /* The timeline is drawn in code with aligned columns, so it needs a
     monospaced font and a scrollbar of its own rather than wrapping. */
  .drawn {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .85rem; overflow-x: auto; white-space: pre;
  }
  .rate {
    display: flex; align-items: center; gap: 8px;
    margin: -8px 0 20px; color: var(--muted); font-size: .85rem;
  }
  .rate button {
    background: none; border: 1px solid var(--line); color: var(--fg);
    border-radius: 999px; padding: 3px 12px; font-size: .9rem; font-weight: 400;
  }
  .rate button:hover:not(:disabled) { border-color: var(--accent); }
  .rate button[aria-pressed="true"] {
    background: var(--accent); color: #fff; border-color: transparent;
  }
  footer {
    margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: .85rem;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <img src="/logo.png" alt="" width="48" height="48">
    <h1>UniConnect AI</h1>
  </header>
  <p class="tagline">
    Ask the group's own history. Every answer cites who said it and when.
    If nothing in the group answers your question, it says so.
  </p>

  <form id="f">
    <input id="q" placeholder="What is the submission deadline?" autocomplete="off" required>
    <button id="go">Ask</button>
  </form>
  <p class="hint">
    Try
    <button type="button" data-q="What are the hackathon deliverables?">the deliverables</button>·
    <button type="button" data-q="Quand a lieu l'Open Hour ?">l'Open Hour (en français)</button>·
    <button type="button" data-q="timeline">the schedule</button>·
    <button type="button" data-q="summary of the group">a summary</button>
  </p>

  <div id="out" hidden></div>

  <footer>
    <!-- No link to /docs: nginx exposes five public paths and that is not one
         of them, so the link would 404 for every visitor. The API browser is
         reachable over an SSH tunnel by whoever needs it. -->
    Same bot that answers in WhatsApp ·
    <a href="/metrics/page">see how the group is using it</a>
  </footer>
</main>

<script>
  // The group this page asks about. Served from the same host as the API, so
  // the calls are relative and there is nothing to configure per deployment.
  const GROUP = new URLSearchParams(location.search).get("group") || "meti-cohort-1";

  const form = document.getElementById("f");
  const input = document.getElementById("q");
  const button = document.getElementById("go");
  const out = document.getElementById("out");

  document.querySelectorAll(".hint button").forEach(b =>
    b.addEventListener("click", () => { input.value = b.dataset.q; form.requestSubmit(); })
  );

  const escape = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  function when(iso) {
    return new Date(iso).toLocaleString(undefined,
      { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  async function rate(answerId, helpful, pressed, other) {
    // Both buttons go dead on the first click. A rating is a single act, and
    // a row that can be flipped back and forth is a row nobody can trust.
    pressed.disabled = other.disabled = true;
    pressed.setAttribute("aria-pressed", "true");
    try {
      await fetch(`/feedback/${answerId}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ helpful }),
      });
      pressed.closest(".rate").lastElementChild.textContent =
        helpful ? "Thank you." : "Noted. This answer will not be reused.";
    } catch {
      pressed.closest(".rate").lastElementChild.textContent =
        "Could not send that, but the answer is still above.";
    }
  }

  function render(data) {
    // A "degraded" answer came from search alone, with no model behind it.
    // Saying so is the point: the page never implies more than it did.
    const flag = data.meta?.degraded
      ? '<div class="flag">answered from search only</div>'
      : data.meta?.duplicate
        ? '<div class="flag">already answered before</div>' : "";

    const sources = (data.sources || []).map((s, i) => `
      <div class="source">
        <div class="who">[${i + 1}] <b>${escape(s.author)}</b> · ${when(s.said_at)}</div>
        <div class="quote">${escape(s.excerpt)}</div>
      </div>`).join("");

    // The timeline arrives as a drawing with aligned columns. Wrapping it
    // like prose turns it into nonsense.
    const body = data.meta?.preformatted
      ? `<div class="drawn">${escape(data.answer)}</div>`
      : escape(data.answer);

    out.innerHTML = `
      <div class="answer">${flag}${body}</div>
      ${sources ? `<h2>Sources</h2>${sources}` : ""}`;

    // Rating needs the answer's own id. Without one there is nothing to
    // rate, which is the case for a greeting or a timeline: neither is an
    // answer drawn from the history and neither is ever reused.
    const answerId = data.meta?.answer_id;
    if (answerId) {
      const bar = document.createElement("div");
      bar.className = "rate";
      bar.innerHTML =
        '<button type="button" title="Useful">👍</button>' +
        '<button type="button" title="Wrong or useless">👎</button>' +
        "<span>Was this useful?</span>";
      const [up, down] = bar.querySelectorAll("button");
      up.addEventListener("click", () => rate(answerId, true, up, down));
      down.addEventListener("click", () => rate(answerId, false, down, up));
      // After the answer, before the sources, which is where the eye lands
      // once it has finished reading.
      out.insertBefore(bar, out.children[1] || null);
    }

    out.hidden = false;
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    button.disabled = true;
    out.hidden = false;
    out.innerHTML = '<div class="answer">Looking through the group…</div>';

    try {
      const r = await fetch("/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ question: input.value, user: "web", group_id: GROUP }),
      });
      if (!r.ok) throw new Error(`the API answered ${r.status}`);
      render(await r.json());
    } catch (err) {
      out.innerHTML = `<div class="answer">Could not reach the bot: ${escape(err.message)}</div>`;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
