name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 06:00 UTC. A dependency that becomes vulnerable next week does
    # not announce itself on a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: a key deleted in a later commit is still a
          # leaked key, and rotating it is the only fix.
          fetch-depth: 0

      - name: Scan the repository and its history
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest \
            git file:///repo --results=verified,unknown --fail

  dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit the pinned versions
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r core/requirements.txt -r ingestion/requirements.txt --strict

  code:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bandit
        # Medium severity and above. Low is mostly "you called subprocess",
        # which we do deliberately and with a fixed argument list.
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r core ingestion -ll

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Needs a public repository, or GitHub Advanced Security on a private one.
    # If this job is the only red one, that is why - see SECURITY.md.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
