version: 2

updates:
  # The API container's dependencies. Grouped into one pull request a week:
  # five separate bumps during a hackathon is noise nobody will review.
  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      core-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /ingestion
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      ingestion-dependencies:
        patterns: ["*"]

  # Actions are pinned by major tag; this catches the ones that go stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # The python base image.
  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Patch and minor updates only. A major bump moves the runtime - 3.12
      # to 3.14 was proposed on day one - while CI still tests on 3.12 and
      # the dependencies are only pinned for it. Changing the interpreter
      # under a running project is a decision, not a routine update: do it
      # deliberately, bumping the Dockerfile and the CI python-version
      # together.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
